name: Fimio
description: >-
  Fimio was a developer-tooling startup founded in 2022 in Oakland, California by
  Omoju Miller (formerly of Google and GitHub). Its first product was an ML-trained
  fraud-detection / malicious-smart-contract reputation API for Web3 builders
  (Ethereum), with data supported by Spice AI, released as an alpha. The company
  later repositioned around "collaborative tooling for serverful applications" and
  "reproducible builds made easy." Fimio appears to be defunct: as of the enrichment
  probe both fimio.xyz and www.fimio.xyz 302-redirect to google.com, the docs/api
  subdomains do not resolve, the blog returns 404, and the GitHub organization
  (fimio-xyz) was archived on 2026-01-27 with only Careers and feedback repositories
  and no published API artifacts. It was backed by a ~$2.19M seed led by Neo with
  Redpoint Ventures, Protocol Labs, The House Fund and angel investors.
